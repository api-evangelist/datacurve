name: Datacurve
description: >-
  Datacurve is a San Francisco-based AI infrastructure company that positions
  itself as "the data engine for frontier AI," building high-quality,
  expert-annotated datasets, reinforcement-learning environments, long-horizon
  agent tasks, benchmarks, and supervised fine-tuning demonstrations used to
  train and evaluate frontier AI models. Its offerings include off-the-shelf and
  custom datasets, agent-trajectory capture (tool calls, pivots, recovery
  attempts), and domain-sensitive evaluations across software engineering, data
  science, cybersecurity, machine learning, and research. Datacurve is backed by
  Homebrew and publishes research such as the DeepSWE long-horizon coding
  benchmark. The company sells through direct engagement (contact@datacurve.ai)
  and currently exposes no public API, developer portal, or SDKs.
